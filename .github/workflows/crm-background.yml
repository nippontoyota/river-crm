name: CRM background processing

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight is read-only. Process runs one controlled import. Storage check creates and deletes a test file.'
        type: choice
        default: preflight
        options:
          - preflight
          - storage-check
          - process

permissions:
  contents: read

concurrency:
  group: crm-background-production
  cancel-in-progress: false

jobs:
  background:
    # Manual diagnostics/cutover runs are allowed while scheduling is disabled.
    # No pull-request trigger and no production jobs from a non-main ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CRM_BACKGROUND_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check migrations and run selected work
        env:
          BACKGROUND_MODE: ${{ inputs.mode || 'process' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          INTAKE_FINGERPRINT_KEY: ${{ secrets.INTAKE_FINGERPRINT_KEY }}
          INTAKE_SECRETS_JSON: ${{ secrets.INTAKE_SECRETS_JSON }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_UPLOAD_BUCKET: ${{ secrets.SUPABASE_UPLOAD_BUCKET }}
          WHATSAPP_MODE: ${{ vars.WHATSAPP_MODE || 'preview' }}
          WHATSAPP_BUSINESS_NAME: ${{ vars.WHATSAPP_BUSINESS_NAME || 'Incheon Mobility' }}
          WHATSAPP_LANGUAGE: ${{ vars.WHATSAPP_LANGUAGE || 'en' }}
          WHATSAPP_TEMPLATE_INTRODUCTION: ${{ vars.WHATSAPP_TEMPLATE_INTRODUCTION || 'so_introduction' }}
          WHATSAPP_TEMPLATE_REASSIGNMENT: ${{ vars.WHATSAPP_TEMPLATE_REASSIGNMENT || 'so_reassignment' }}
          INTAKE_EXECUTION_MODE: database
          CELERY_TASK_ALWAYS_EAGER: 'false'
          INTAKE_ENABLED: 'true'
          DJANGO_DEBUG: 'false'
        run: python background.py "$BACKGROUND_MODE"
