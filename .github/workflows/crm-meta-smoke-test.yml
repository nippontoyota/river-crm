name: CRM Meta test lead (manual only)

on:
  workflow_dispatch:
    inputs:
      replace_test_id:
        description: 'Optional: explicitly authorized existing Meta test ID to replace; CRM receipt must already retain its answers.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crm-meta-smoke-test
  cancel-in-progress: false

jobs:
  create-test-lead:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Create one labelled Meta test enquiry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          INTAKE_SECRETS_JSON: ${{ secrets.INTAKE_SECRETS_JSON }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          REPLACE_META_TEST_ID: ${{ inputs.replace_test_id }}
          INTAKE_EXECUTION_MODE: database
          INTAKE_ENABLED: 'true'
          CELERY_TASK_ALWAYS_EAGER: 'false'
          DJANGO_DEBUG: 'false'
        run: python meta_test_lead.py
