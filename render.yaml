# Existing river-crm: follow backend/intake/README.md before applying.
# Do not create a second web service or replace existing signing keys.
# Create river-runtime manually with existing credentials; see the rollout guide.
services:
  - type: keyvalue
    name: river-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: river-crm
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 1
    healthCheckPath: /api/schema/
    envVars:
      - fromGroup: river-runtime
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
      - key: CACHE_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "50"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
  - type: worker
    name: river-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config worker --loglevel=warning --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100
    envVars:
      - fromGroup: river-runtime
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
  - type: worker
    name: river-scheduler
    runtime: python
    plan: starter
    numInstances: 1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    envVars:
      - fromGroup: river-runtime
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
