# Target: existing river-crm plus one five-minute cron job.
# Follow backend/intake/README.md for a staged manual cutover first.
# Create river-runtime manually with existing secrets; do not rotate signing keys.
# Review Blueprint changes before syncing; retain workers used by other features.
services:
  - type: web
    name: river-crm
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 1
    healthCheckPath: /api/schema/
    envVars:
      - fromGroup: river-runtime
      - key: INTAKE_EXECUTION_MODE
        value: database
      - key: CACHE_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "50"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
  - type: cron
    name: river-intake-processor
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "*/5 * * * *"
    startCommand: python manage.py migrate --check && python manage.py intake_process_pending
    envVars:
      - fromGroup: river-runtime
      - key: INTAKE_EXECUTION_MODE
        value: database
