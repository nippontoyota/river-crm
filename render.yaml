# Legacy Celery Blueprint retained during the gated Actions cutover.
# Do not sync it for Actions deployment: follow backend/intake/README.md instead.
# Change live web mode only after preflight; retire old services after 24 hours.
# Target: existing river-crm plus a persistent queue, Celery worker and scheduler.
# Follow backend/intake/README.md for a staged manual cutover first.
# Create river-runtime manually with existing secrets; do not rotate signing keys.
# Use the existing web service's region for every service. Check the Blueprint preview.
# Verify worker/scheduler health before changing the web's eager/mode overrides.
services:
  - type: keyvalue
    name: river-queue
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: river-crm
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 1
    healthCheckPath: /api/schema/
    envVars:
      - fromGroup: river-runtime
      - key: INTAKE_EXECUTION_MODE
        value: celery
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: INTAKE_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
      - key: CACHE_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "50"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
  - type: worker
    name: river-worker
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config worker --loglevel=warning --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100
    envVars:
      - fromGroup: river-runtime
      - key: INTAKE_EXECUTION_MODE
        value: celery
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: INTAKE_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
  - type: worker
    name: river-scheduler
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    envVars:
      - fromGroup: river-runtime
      - key: INTAKE_EXECUTION_MODE
        value: celery
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: INTAKE_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: river-queue
          property: connectionString
